events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # Rediriger HTTP vers HTTPS sur le port local 28443
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        return 301 https://$host:28443$request_uri;
    }

    # Serveur HTTPS de Pr?production
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/preprod.crt;
        ssl_certificate_key /etc/nginx/certs/preprod.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
