
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB requis}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL requis}"
      PORT: "8080"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?ADMIN_API_TOKEN requis}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_HOST_PORT:-80}:80"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - "${NGINX_CONF_FILE:-./nginx.conf}:/etc/nginx/nginx.conf:ro"
      - ./portal.html:/usr/share/nginx/html/index.html:ro
      - "${NGINX_CERT_DIR:-./secrets/empty}:/etc/nginx/certs:ro"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
