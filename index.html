<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eSIGN & Compliance - Hub</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b1120;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #0369a1;
      color: #38bdf8;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">• En ligne sur Vercel</span>
    <h1>eSIGN & Compliance</h1>
    <p>Portail de signature électronique avancée (PAdES) et d'audit de conformité documentaire.</p>
    <div class="grid">
      <a href="/portail.html" class="btn">
        <span>1. Portail de Conformité</span>
        <span>→</span>
      </a>
      <a href="/session_signature.html" class="btn">
        <span>2. Session de Signature (PAdES)</span>
        <span>→</span>
      </a>
    </div>
  </div>
</body>
</html>
