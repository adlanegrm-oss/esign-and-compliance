<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eSIGN & Compliance</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 12px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin-bottom: 0.5rem; color: #38bdf8; font-size: 1.8rem; }
    p { color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">● En ligne sur Vercel</div>
    <h1>eSIGN &amp; Compliance</h1>
    <p>Portail de signature électronique avancée (PAdES) et d'audit de conformité documentaire.</p>
  </div>
</body>
</html>
